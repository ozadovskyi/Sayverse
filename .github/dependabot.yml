version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Expo/RN framework cluster — moves via `expo install --fix` / SDK
      # upgrades, never standalone Dependabot PRs (independent bumps break
      # peer deps, e.g. reanimated <-> worklets). Covers prefix and suffix.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "*-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: "@types/react"
      # Majors land via deliberate upgrades, not auto-PRs (TS 6, tailwind 4,
      # SDK-56 bumps are all majors and don't belong on a managed SDK 55 app).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
