version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # React / Expo / RN framework — version-locked to the Expo SDK; bump via
      # `expo install --fix` / an SDK upgrade, not standalone Dependabot PRs.
      # react-* covers react-dom, react-native, react-native-*, react-test-renderer.
      - dependency-name: "react"
      - dependency-name: "react-*"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-*"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "*-expo"
      - dependency-name: "@expo/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@shopify/react-native-skia"
      # Majors land via deliberate upgrades, not auto-PRs (TS 6, tailwind 4, SDK 56).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
